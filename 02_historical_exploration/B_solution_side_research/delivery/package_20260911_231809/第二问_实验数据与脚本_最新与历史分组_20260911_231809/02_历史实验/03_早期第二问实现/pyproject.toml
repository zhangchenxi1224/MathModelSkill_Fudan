[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cumcm-bsolver"
version = "1.0.0"
description = "Certified coverage and bounded-error localization for the CUMCM B simulator"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
research = ["numpy>=1.24", "matplotlib>=3.7", "pytest>=7"]

[project.scripts]
bsolver = "bsolver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
